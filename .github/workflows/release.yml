# Release: build, sign, verify and prepare a DRAFT GitHub release of compat.
# Nothing is published: the operator reviews the draft and publishes it.
#
# Triggers and modes:
#   push of tag v<version>      release mode, production key. The tag must
#                               equal v<project version> and carry no label.
#   dispatch, mode release      production key; requires a pre-release label
#                               (an update rehearsal, e.g. rehearsal.1). A
#                               release without a label comes only from a tag.
#   dispatch, mode test-release disposable rehearsal key.
#   dispatch, mode local        no key: verifies an APK the operator signed
#                               locally and attached, with its .sha256 and
#                               .json, to the existing draft release named by
#                               `release`, against this run's unsigned build,
#                               then adds the notes and inventory to that draft.
#
# Each job holds only what it needs:
#   plan     contents: read; decides mode, label and environment
#   build    contents: read; build-apk.yml (stock input via `build-inputs`)
#   sign     contents: read; the signing environment's secrets, nothing else
#   collect  contents: write (draft releases are visible only with it), no
#            secrets, no checkout; mode local only, downloads the draft's APK
#   verify   contents: read, actions: read; verify-release.yml, no secrets
#   draft    contents: write; no secrets; creates the draft release, or in
#            mode local completes the operator's draft
# There is no pull_request trigger, and the `release` environment admits only
# v* tags and main, so no secret reaches untrusted code.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [test-release, release, local]
        default: test-release
      prerelease:
        description: Pre-release label, e.g. rehearsal.1 (required for mode release)
        type: string
        default: ""
      release:
        description: "Mode local: the draft release holding the locally signed APK"
        type: string
        default: ""

permissions: {}

concurrency:
  group: release-${{ github.ref }}-${{ inputs.mode || 'tag' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      environment: ${{ steps.plan.outputs.environment }}
      tag: ${{ steps.plan.outputs.tag }}
      verify-mode: ${{ steps.plan.outputs.verify-mode }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IN_MODE: ${{ inputs.mode }}
          IN_LABEL: ${{ inputs.prerelease }}
          IN_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ *VERSION \([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' CMakeLists.txt | head -1)"
          test -n "$version" || { echo "no project VERSION in CMakeLists.txt" >&2; exit 1; }
          if [ "$EVENT" = push ]; then
            [ "$REF_TYPE" = tag ] || { echo "release runs on tags only" >&2; exit 1; }
            if [ "$REF_NAME" != "v$version" ]; then
              echo "tag $REF_NAME does not equal v$version (project VERSION); labelled tags are refused" >&2
              exit 1
            fi
            mode=release label="" tag="$REF_NAME" release=""
          else
            mode="$IN_MODE" label="$IN_LABEL" tag="" release=""
            if [ -n "$label" ] && ! printf '%s' "$label" | grep -qE '^[0-9A-Za-z]+(\.[0-9A-Za-z]+)*$'; then
              echo "invalid pre-release label" >&2; exit 1
            fi
            if [ "$mode" = release ] && [ -z "$label" ]; then
              echo "a dispatched release needs a pre-release label; an unlabelled release comes from its tag" >&2
              exit 1
            fi
            if [ "$mode" = local ]; then
              release="$IN_RELEASE"
              printf '%s' "$release" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$' \
                || { echo "mode local needs the name of a draft release (v<version>...)" >&2; exit 1; }
              # A draft named exactly v<version> is the release: the APK's tag must match it.
              if [ "$release" = "v$version" ]; then tag="$release"; fi
            fi
          fi
          case "$mode" in
            release) env_name=release verify_mode=release ;;
            test-release) env_name=release-rehearsal verify_mode=test-release ;;
            local) env_name="" verify_mode=release ;;
            *) echo "unknown mode $mode" >&2; exit 1 ;;
          esac
          {
            echo "mode=$mode"; echo "prerelease=$label"; echo "environment=$env_name"; echo "tag=$tag"
            echo "verify-mode=$verify_mode"; echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "mode $mode, label '${label}', environment $env_name, version $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/build-apk.yml
    # A called workflow sees its job environment's secrets (the input deploy
    # key in `build-inputs`) only when the caller passes secrets on. No
    # secret is stored at repository level, so this passes nothing else.
    secrets: inherit
    with:
      variants: '["compat"]'
      prerelease: ${{ needs.plan.outputs.prerelease }}
      release-inputs: true

  sign:
    needs: [plan, build]
    if: needs.plan.outputs.mode != 'local'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ needs.plan.outputs.environment }}
    permissions:
      contents: read
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      LABEL: ${{ needs.plan.outputs.prerelease }}
    steps:
      # The runner context is not available in job-level env.
      - run: echo "IN=$RUNNER_TEMP/in" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tc
        uses: ./.github/actions/apk-toolchain
        with:
          packages: cmake/3.22.1 build-tools/37.0.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs
          path: ${{ runner.temp }}/in
      - name: Check the release inputs
        run: |
          set -euo pipefail
          (cd "$IN" && sha256sum -c SHA256SUMS)
          got="$(sed -n 's/^PRERELEASE=//p' "$IN/release.env")"
          [ "$got" = "$LABEL" ] || { echo "release.env label '$got' is not '$LABEL'" >&2; exit 1; }
          python3 scripts/ci/check_elf.py arm64-v8a "$IN/native"

      # One step per mode, each naming only its own secrets, so a missing
      # production secret can never fall back to the rehearsal key.
      - name: Keystore (release)
        if: needs.plan.outputs.mode == 'release'
        env:
          KS_B64: ${{ secrets.SBC_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KS_B64" || { echo "SBC_RELEASE_KEYSTORE_B64 is not set" >&2; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/ks"
          (umask 077; printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks/release.p12")
      - name: Keystore (test-release)
        if: needs.plan.outputs.mode == 'test-release'
        env:
          KS_B64: ${{ secrets.SBC_TEST_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KS_B64" || { echo "SBC_TEST_RELEASE_KEYSTORE_B64 is not set" >&2; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/ks"
          (umask 077; printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks/release.p12")

      - name: Sign and verify (release)
        if: needs.plan.outputs.mode == 'release'
        env:
          SDK: ${{ steps.tc.outputs.sdk }}
          SBC_RELEASE_KEYSTORE: ${{ runner.temp }}/ks/release.p12
          SBC_RELEASE_KEYSTORE_PASS: ${{ secrets.SBC_RELEASE_KEYSTORE_PASS }}
          SBC_RELEASE_KEY_PASS: ${{ secrets.SBC_RELEASE_KEY_PASS }}
          SBC_RELEASE_KEY_ALIAS: ${{ vars.SBC_RELEASE_KEY_ALIAS }}
          SBC_RELEASE_CERT_SHA256: ${{ vars.SBC_RELEASE_CERT_SHA256 }}
        run: bash scripts/ci/sign_release.sh
      - name: Sign and verify (test-release)
        if: needs.plan.outputs.mode == 'test-release'
        env:
          SDK: ${{ steps.tc.outputs.sdk }}
          SBC_TEST_RELEASE_KEYSTORE: ${{ runner.temp }}/ks/release.p12
          SBC_TEST_RELEASE_KEYSTORE_PASS: ${{ secrets.SBC_TEST_RELEASE_KEYSTORE_PASS }}
          SBC_TEST_RELEASE_KEY_PASS: ${{ secrets.SBC_TEST_RELEASE_KEY_PASS }}
          SBC_TEST_RELEASE_KEY_ALIAS: ${{ vars.SBC_TEST_RELEASE_KEY_ALIAS }}
          SBC_TEST_RELEASE_CERT_SHA256: ${{ vars.SBC_TEST_RELEASE_CERT_SHA256 }}
        run: bash scripts/ci/sign_release.sh

      - name: Remove the keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/ks" "$RUNNER_TEMP/sign-work"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error

  # Mode local: the operator's draft supplies the signed APK. Only a draft is
  # accepted, and exactly one APK with its .sha256 and .json.
  collect:
    needs: plan
    if: needs.plan.outputs.mode == 'local'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE: ${{ needs.plan.outputs.release }}
    steps:
      - name: Download the locally signed APK from the draft
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          draft="$(gh release view "$RELEASE" --json isDraft --jq .isDraft)"
          [ "$draft" = true ] || { echo "$RELEASE is not a draft release" >&2; exit 1; }
          gh release download "$RELEASE" -p '*.apk' -p '*.apk.sha256' -p '*.apk.json' -D "$OUT"
          n="$(ls "$OUT"/*.apk | wc -l)"
          [ "$n" -eq 1 ] || { echo "$RELEASE holds $n APKs, expected 1" >&2; exit 1; }
          apk="$(basename "$(ls "$OUT"/*.apk)")"
          test -f "$OUT/$apk.sha256" && test -f "$OUT/$apk.json" \
            || { echo "$RELEASE lacks $apk.sha256 or $apk.json" >&2; exit 1; }
          {
            echo "locally signed APK from draft $RELEASE: $apk"
            echo "sha256 $(sha256sum "$OUT/$apk" | cut -d' ' -f1)"
            echo "built from $(sed -n 's/^ *"source_commit" *: *"\([^"]*\)".*/\1/p' "$OUT/$apk.json"), verified against $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error

  verify:
    needs: [plan, build, sign, collect]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' &&
      (needs.sign.result == 'success' || needs.collect.result == 'success')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verify-release.yml
    with:
      mode: ${{ needs.plan.outputs.verify-mode }}
      tag: ${{ needs.plan.outputs.tag }}

  draft:
    needs: [plan, verify]
    if: "!cancelled() && needs.verify.result == 'success'"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      LABEL: ${{ needs.plan.outputs.prerelease }}
      RELEASE: ${{ needs.plan.outputs.release }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-apk
          path: ${{ runner.temp }}/out
      - name: Notes and inventory
        run: |
          set -euo pipefail
          meta="$(ls "$RUNNER_TEMP"/out/*.apk.json)"
          tag="$(sed -n 's/^ *"release_tag" *: *"\([^"]*\)".*/\1/p' "$meta")"
          test -n "$tag" || { echo "no release_tag in $meta" >&2; exit 1; }
          python3 scripts/release/release_notes.py notes --tag "$tag" --metadata "$meta" -o "$RUNNER_TEMP/notes.md"
          # A rehearsal draft must not take the name the release will use.
          if [ "$MODE" = test-release ]; then tag="$tag-test-release.$GITHUB_RUN_NUMBER"; fi
          if [ "$MODE" = local ]; then tag="$RELEASE"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          python3 scripts/release/inventory.py --metadata "$meta" \
            -o "$RUNNER_TEMP/out/INVENTORY.md" --json "$RUNNER_TEMP/out/inventory.json"
      # Mode local: the APK, .sha256 and .json stay exactly as the operator
      # attached them; only the notes and the inventory are added.
      - name: Complete the operator's draft release
        if: env.MODE == 'local'
        run: |
          set -euo pipefail
          [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ] \
            || { echo "$TAG is no longer a draft; nothing is changed" >&2; exit 1; }
          flags=(--title "SB Connect Compat $TAG" --notes-file "$RUNNER_TEMP/notes.md")
          if [ -n "$LABEL" ]; then flags+=(--prerelease); fi
          gh release edit "$TAG" "${flags[@]}"
          gh release upload "$TAG" "$RUNNER_TEMP/out/INVENTORY.md" "$RUNNER_TEMP/out/inventory.json"
          echo "draft release $TAG verified and completed; publication is the operator's decision" >> "$GITHUB_STEP_SUMMARY"
      - name: Create the draft release
        if: env.MODE != 'local'
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "a release named $TAG already exists; nothing is changed" >&2
            exit 1
          fi
          flags=(--draft --title "SB Connect Compat $TAG" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$MODE" = test-release ] || [ -n "$LABEL" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" --target "$GITHUB_SHA" "$RUNNER_TEMP"/out/*
          echo "draft release $TAG prepared; publication is the operator's decision" >> "$GITHUB_STEP_SUMMARY"
