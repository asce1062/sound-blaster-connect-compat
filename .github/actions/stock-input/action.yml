name: Stock APK input
description: >
  Take the stock APK from the private build-input repository the trusted
  workflow runs in, and place it at inputs/SBConnect_v1.04.02.apk after
  checking its SHA-256 against the pin in CMakeLists.txt of the source
  checkout. The workflow token reads the repository it runs in, so no key is
  involved. The input checkout is removed before this action ends; the APK
  never enters the compat repository.
inputs:
  path:
    description: Path of the APK inside the build-input repository
    required: false
    default: SBConnect_v1.04.02.apk
runs:
  using: composite
  steps:
    - name: Check out the build-input repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: .build-inputs
        sparse-checkout: ${{ inputs.path }}
        sparse-checkout-cone-mode: false
        persist-credentials: false
        fetch-depth: 1

    - name: Verify and stage the stock APK
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        pin="$(sed -n '/^set(apk_input_sha256/,/)/p' CMakeLists.txt | grep -oE '[0-9a-f]{64}' | head -1)"
        test ${#pin} -eq 64 || { echo "no apk_input_sha256 pin in CMakeLists.txt" >&2; exit 1; }
        src=".build-inputs/${INPUT_PATH}"
        test -f "$src" || { echo "input not found in the build-input repository: ${INPUT_PATH}" >&2; exit 1; }
        got="$(sha256sum "$src" | cut -d' ' -f1)"
        if [ "$got" != "$pin" ]; then
          echo "stock APK SHA-256 $got does not match the pin $pin" >&2
          exit 1
        fi
        mkdir -p inputs
        cp "$src" inputs/SBConnect_v1.04.02.apk
        echo "stock APK verified: $got"

    - name: Remove the build-input checkout
      if: always()
      shell: bash
      run: rm -rf .build-inputs
