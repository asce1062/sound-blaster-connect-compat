name: APK toolchain
description: >
  Pinned JDK and Android SDK packages for the APK pipeline. Packages the
  runner image lacks are installed, and every package's revision is verified
  against scripts/ci/sdk-packages.txt, so a different revision fails the job
  instead of reaching the build. SDK packages are not cached: the runner
  image preinstalls most of them in directories a cache restore cannot
  write, and installing the rest is faster than restoring them.
inputs:
  packages:
    description: Space-separated subset of sdk-packages.txt paths (default all)
    required: false
    default: ""
outputs:
  sdk:
    description: Android SDK root
    value: ${{ steps.sdk.outputs.root }}
runs:
  using: composite
  steps:
    - name: JDK (javac of the accepted builds)
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: "23.0.2+7"

    - id: sdk
      name: SDK root
      shell: bash
      run: |
        root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        test -n "$root" || { echo "no Android SDK on this runner" >&2; exit 1; }
        echo "root=$root" >> "$GITHUB_OUTPUT"

    - name: Install and verify SDK packages
      shell: bash
      env:
        ANDROID_HOME: ${{ steps.sdk.outputs.root }}
      run: bash scripts/ci/android_sdk_install.sh ${{ inputs.packages }}
