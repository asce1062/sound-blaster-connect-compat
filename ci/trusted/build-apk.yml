# Trusted APK build: all four variants from the SHA-256-pinned stock APK.
#
# Canonical copy: ci/trusted/build-apk.yml in the compat repository. It runs
# from .github/workflows/ of the private build-input repository, which holds
# the stock APK, so the APK, every build output and every artifact stay
# private. Each job checks out the compat source (repository variable
# SBC_SOURCE_REPOSITORY) at the requested commit, then the trusted-definition
# action refuses a public repository and any workflow file that differs from
# ci/trusted/ at that commit (docs/development/CI.md, trusted builds).
#
# Variants are built in parallel jobs and uploaded as private artifacts,
# except when the release workflow asks for the unsigned compat APK it signs.
name: Build APKs

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Compat source commit to build (full SHA)
        type: string
        required: true
  workflow_call:
    inputs:
      ref:
        description: Compat source commit to build (full SHA)
        type: string
        required: true
      variants:
        description: JSON list of variants to build
        type: string
        default: '["resign", "modernize", "arm64", "compat"]'
      prerelease:
        description: Pre-release label (sbc_prerelease), empty for a release
        type: string
        default: ""
      release-inputs:
        description: Upload the unsigned compat APK, release.env and native libraries
        type: boolean
        default: false
    outputs:
      unsigned-sha256:
        description: SHA-256 of the unsigned compat APK
        value: ${{ jobs.variant.outputs.unsigned-sha256 }}

permissions:
  contents: read

jobs:
  variant:
    name: ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants || '["resign", "modernize", "arm64", "compat"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      unsigned-sha256: ${{ steps.hash.outputs.unsigned }}
    env:
      VARIANT: ${{ matrix.variant }}
      PRERELEASE: ${{ inputs.prerelease || '' }}
    steps:
      - name: Source (compat repository at the requested commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.SBC_SOURCE_REPOSITORY }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/trusted-definition
        with:
          ref: ${{ inputs.ref }}

      - name: Validate the pre-release label
        run: |
          if [ -n "$PRERELEASE" ] && ! printf '%s' "$PRERELEASE" | grep -qE '^[0-9A-Za-z]+(\.[0-9A-Za-z]+)*$'; then
            echo "invalid pre-release label" >&2; exit 1
          fi

      - id: tc
        uses: ./.github/actions/apk-toolchain

      - name: Stock APK (verified against the pin before any patch)
        uses: ./.github/actions/stock-input

      # The jars are immutable: CMakeLists.txt holds their versions and SHA-256
      # pins, so any pin change is a new key, and configure re-verifies every
      # restored jar against its pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools
          key: jars-${{ hashFiles('CMakeLists.txt') }}

      # The SDK's CMake 3.22.1 on the Linux runner stops at file(DOWNLOAD) with
      # "cannot open file for write", so the jars are fetched here and
      # configure only verifies them.
      - name: Tool jars (verified against their pins)
        run: python3 scripts/ci/check_pins.py --download build/tools .

      - name: Configure
        env:
          SDK: ${{ steps.tc.outputs.sdk }}
        run: |
          "$SDK/cmake/3.22.1/bin/cmake" -S . -B build -G Ninja \
            -DCMAKE_MAKE_PROGRAM="$SDK/cmake/3.22.1/bin/ninja" \
            -Dandroid_sdk_root="$SDK" \
            -Dandroid_ndk="$SDK/ndk/25.1.8937393" \
            -Dzipalign_bin="$SDK/build-tools/33.0.1/zipalign" \
            -Dapktool_jobs="$(nproc)" \
            -Dsbc_prerelease="$PRERELEASE"

      - name: Build
        env:
          SDK: ${{ steps.tc.outputs.sdk }}
        run: |
          start=$(date +%s)
          "$SDK/cmake/3.22.1/bin/cmake" --build build --target "apk-$VARIANT"
          echo "build apk-$VARIANT: $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"

      - name: Native libraries match the accepted build
        if: matrix.variant == 'arm64' || matrix.variant == 'compat'
        run: python3 scripts/ci/check_elf.py arm64-v8a build/native/arm64-v8a/lib

      - id: hash
        name: Hashes
        run: |
          {
            echo "source $(git rev-parse HEAD)"; echo
            echo "| file | SHA-256 | content digest (any order) |"; echo "|---|---|---|"
            for f in build/sbc_"$VARIANT"*.apk; do
              d="$(python3 scripts/ci/compare_apks.py --digest --ignore-signatures --any-order "$f" | cut -d' ' -f1)"
              echo "| $(basename "$f") | $(sha256sum "$f" | cut -d' ' -f1) | $d |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$VARIANT" = compat ]; then
            echo "unsigned=$(sha256sum "build/sbc_$VARIANT.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APKs (private repository only)
        if: github.event.repository.private && !inputs.release-inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ matrix.variant }}
          path: build/sbc_${{ matrix.variant }}*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Stage the release inputs
        if: inputs.release-inputs && matrix.variant == 'compat'
        run: |
          mkdir -p release-inputs/native
          cp build/sbc_compat.apk build/release.env release-inputs/
          cp build/native/arm64-v8a/lib/*.so release-inputs/native/
          (cd release-inputs && sha256sum sbc_compat.apk release.env native/*.so > SHA256SUMS)
      - name: Upload the release inputs (private repository only)
        if: github.event.repository.private && inputs.release-inputs && matrix.variant == 'compat'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-inputs
          path: release-inputs/
          retention-days: 1
          if-no-files-found: error
